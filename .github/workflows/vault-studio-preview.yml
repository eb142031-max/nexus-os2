name: Dark Leyla Vault Studio checks
on:
  pull_request:
    paths:
      - "darkleyla/**"
      - "tests/**"
      - ".github/workflows/vault-studio-preview.yml"
  push:
    branches:
      - "feat/dark-leyla-vault-studio-preview"
permissions:
  contents: read
jobs:
  prototype-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run governance and Vault Studio tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
