name: Dark Leyla Creator OS CI
on:
  pull_request:
    paths:
      - "creator_os/**"
      - ".github/workflows/creator-os-ci.yml"
  push:
    branches:
      - "feat/dark-leyla-creator-os-mvp"
    paths:
      - "creator_os/**"
      - ".github/workflows/creator-os-ci.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r creator_os/requirements.txt
      - name: Run Creator OS tests
        working-directory: creator_os
        env:
          DARKLEYLA_BOOTSTRAP_TOKEN: test-bootstrap-token
          DARKLEYLA_MASTER_KEY: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
          DATABASE_URL: sqlite:///./ci_test.db
        run: python -m unittest discover -s tests -v
      - name: Install browser test runtime
        run: |
          pip install playwright==1.52.0
          python -m playwright install --with-deps chromium
      - name: Run real-browser workflow smoke test
        working-directory: creator_os
        run: python tests/browser_smoke.py -v
