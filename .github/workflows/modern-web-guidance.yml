name: Modern Web Guidance readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - 'package.json'
      - '.mwgrc'
      - '.github/workflows/modern-web-guidance.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm app source exists
        id: source
        shell: bash
        run: |
          if find . -path './.git' -prune -o \( -name '*.html' -o -name '*.js' -o -name '*.ts' -o -name '*.tsx' \) -print | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No web app source found; scan deferred until Citadel source is imported"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run advisory legacy scan
        if: steps.source.outputs.found == 'true'
        run: npx --yes modern-web-guidance@1.0.0 legacy-scan .
